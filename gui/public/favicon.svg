<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Moyin Factory Icon">
  <defs>
    <!-- 櫻花粉漸變 -->
    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc0d3"/>
      <stop offset="100%" stop-color="#cf7080"/>
    </linearGradient>
  </defs>

  <!-- 背景圓形 -->
  <circle cx="50" cy="50" r="48" fill="#2d1b2e"/>

  <!-- 櫻花花瓣（簡化版，正方形適配） -->
  <g transform="translate(50 50) rotate(-15)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="url(#petalGradient)" opacity="0.95"/>
    <!-- 根部白色高光 -->
    <ellipse cx="-15" cy="0" rx="12" ry="8" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 紋路 -->
  <g stroke="#f8dce3" stroke-width="0.5" fill="none" opacity="0.3" transform="translate(50 50) rotate(-15)">
    <line x1="-25" y1="-5" x2="25" y2="-5"/>
    <line x1="-25" y1="0" x2="25" y2="0"/>
    <line x1="-25" y1="5" x2="25" y2="5"/>
  </g>
</svg>
